# Shares port 443 between VLESS/Reality and the Telegram WEB proxy by the TLS SNI,
# without terminating TLS. The routing table is rendered from
# templates/sni.conf.template with TG_WEBPROXY_DOMAIN at container start
# (into /etc/nginx: the image's envsubst step skips output directories that do not exist).
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    include /etc/nginx/sni.conf;
}
