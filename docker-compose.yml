x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker_socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TIMEOUT_CLIENT: 30s
      TIMEOUT_CONNECT: 30s
      TIMEOUT_SERVER: 30s
      CONTAINERS: 1   # allow GET /containers/*
      EXEC: 1         # allow creating and running exec sessions
      KILL: 1         # allow sending signals (SIGHUP for xray reload)
      POST: 1         # allow POST requests required by exec and kill
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vpn_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpn}
      POSTGRES_USER: ${POSTGRES_USER:-vpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  amneziawg:
    build: ./amneziawg
    container_name: amneziawg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - ./amneziawg/config:/etc/amneziawg
      - /lib/modules:/lib/modules:ro
    ports:
      - "${AWG_PORT:-51820}:51820/udp"
    networks:
      - frontend
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    # Pinned: Xray 26.9.8+ requires an X25519MLKEM768 key share in the Reality
    # ClientHello, and sing-box-based clients (Karing, Hiddify) fail with
    # "reality verification failed" (https://github.com/KaringX/karing/issues/1952)
    image: ghcr.io/xtls/xray-core:26.7.28
    container_name: xray
    volumes:
      - ./xray:/usr/local/etc/xray
    # Port 443 is published by sni-router
    networks:
      - frontend
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Port 443 is shared: the router passes TLS for TG_WEBPROXY_DOMAIN to the WEB proxy
  # and everything else to Xray, without decrypting either
  sni-router:
    image: nginx:1.27-alpine
    container_name: sni_router
    ports:
      - "443:443"
    environment:
      # An empty domain would leave nginx unable to start, taking VLESS down with it
      TG_WEBPROXY_DOMAIN: ${TG_WEBPROXY_DOMAIN:?set TG_WEBPROXY_DOMAIN in .env (bash scripts/setup.sh)}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./sni-router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sni-router/templates:/etc/nginx/templates:ro
    networks:
      - frontend
    depends_on:
      - xray
      - webproxy
    logging: *default-logging
    restart: unless-stopped

  # Telegram WEB proxy: Caddy (TLS) -> tproxy-server -> teleproxy -> Telegram.
  # The relay only talks over loopback, so Caddy and teleproxy join this
  # container's network namespace
  webproxy:
    build: ./webproxy
    container_name: webproxy
    environment:
      TG_WEBPROXY_DOMAIN: ${TG_WEBPROXY_DOMAIN:?set TG_WEBPROXY_DOMAIN in .env (bash scripts/setup.sh)}
      TG_WEBPROXY_SECRET: ${TG_WEBPROXY_SECRET:?set TG_WEBPROXY_SECRET in .env (bash scripts/setup.sh)}
    volumes:
      - webproxy_data:/data
      - ./webproxy/site:/data/site
    ports:
      - "80:80"   # Let's Encrypt HTTP challenge and redirect to HTTPS, served by Caddy
    networks:
      - frontend
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webproxy-caddy:
    image: caddy:2.8-alpine
    container_name: webproxy_caddy
    network_mode: service:webproxy
    environment:
      TG_WEBPROXY_DOMAIN: ${TG_WEBPROXY_DOMAIN}
    volumes:
      - ./webproxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webproxy
    logging: *default-logging
    restart: unless-stopped

  webproxy-backend:
    image: ghcr.io/teleproxy/teleproxy:4.9.0
    container_name: webproxy_backend
    network_mode: service:webproxy
    environment:
      SECRET: ${TG_WEBPROXY_SECRET}
      PORT: "2398"
      # Straight to Telegram's DCs: no middle-end, so Docker's NAT does not matter
      DIRECT_MODE: "true"
      EXTERNAL_IP: ${SERVER_IP}
      # Only the relay connects here; the public TLS ends at Caddy
      MSS_CLAMP: "false"
    depends_on:
      - webproxy
    logging: *default-logging
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: vpn_bot
    volumes:
      - ./amneziawg/config:/etc/amneziawg
      - ./xray:/etc/xray
    environment:
      DOCKER_HOST: tcp://docker_socket_proxy:2375
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpn}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vpn}
    env_file: .env
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      amneziawg:
        condition: service_healthy
      xray:
        condition: service_healthy
      webproxy:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging: *default-logging
    restart: unless-stopped

networks:
  # Docker API and database. VPN clients' traffic leaves through the frontend
  # containers, so nothing that carries it may be attached here — only the bot is.
  backend:
    internal: true
  # Containers that face the internet and forward client traffic
  frontend:

volumes:
  postgres_data:
  webproxy_data:
  caddy_data:
  caddy_config:
