services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker_socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TIMEOUT_CLIENT: 30s
      TIMEOUT_CONNECT: 30s
      TIMEOUT_SERVER: 30s
      CONTAINERS: 1   # allow GET /containers/*
      EXEC: 1         # allow creating and running exec sessions
      KILL: 1         # allow sending signals (SIGHUP for xray reload)
      POST: 1         # allow POST requests required by exec and kill
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vpn_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpn}
      POSTGRES_USER: ${POSTGRES_USER:-vpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  amneziawg:
    build: ./amneziawg
    container_name: amneziawg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - ./amneziawg/config:/etc/amneziawg
      - /lib/modules:/lib/modules:ro
    ports:
      - "${AWG_PORT:-51820}:51820/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    volumes:
      - ./xray:/usr/local/etc/xray
    ports:
      - "${XRAY_PORT:-443}:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mtproxy:
    image: nineseconds/mtg:2
    container_name: mtproxy
    ports:
      - "${MTPROXY_PORT:-8443}:3128"
    command: simple-run 0.0.0.0:3128 ${MTPROXY_SECRET} --prefer-ip=prefer-ipv4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mtg", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  bot:
    build: ./bot
    container_name: vpn_bot
    volumes:
      - ./amneziawg/config:/etc/amneziawg
      - ./xray:/etc/xray
    environment:
      DOCKER_HOST: tcp://docker_socket_proxy:2375
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpn}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vpn}
    env_file: .env
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      amneziawg:
        condition: service_healthy
      xray:
        condition: service_healthy
      mtproxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
